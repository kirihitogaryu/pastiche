<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pastiche Atlas Search Browser — Picasso / Horse</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #090908;
				--surface-0: #0c0c0b;
				--surface-1: #11100f;
				--surface-2: #171614;
				--surface-3: #201e1b;
				--line: rgba(238, 232, 220, 0.105);
				--line-strong: rgba(238, 232, 220, 0.18);
				--text: #e9e2d7;
				--text-soft: #c7bfb4;
				--text-muted: #8c857d;
				--heading-muted: #b9b0a4;
				--accent: #c79a52;
				--accent-soft: #ddba74;
				--positive: #95af76;
				--review: #d2a25b;
				--visual: #76a7d7;
				--entity: #84b8e6;
				--artist: #9c9fde;
				--work: #b995dd;
				--classifier: #a7ae78;
				--theme: #68bbc4;
				--source: #98a7b1;
				--prompt: #d3a158;
				--rail: 74px;
				--left: clamp(300px, 23vw, 360px);
				--radius: 10px;
				--sans:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				--serif: Georgia, 'Times New Roman', serif;
				--mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
			}

			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
			}
			body {
				margin: 0;
				overflow: hidden;
				background:
					radial-gradient(circle at 75% -20%, rgba(156, 132, 89, 0.12), transparent 36%),
					linear-gradient(135deg, #080807, #10100f 48%, #090908);
				color: var(--text);
				font-family: var(--sans);
				font-size: 14px;
			}

			button,
			input,
			select {
				font: inherit;
				color: inherit;
			}
			button {
				border: 1px solid var(--line-strong);
				background: rgba(255, 255, 255, 0.025);
				min-height: 38px;
				border-radius: 9px;
				padding: 0 13px;
				cursor: pointer;
				transition:
					background 0.16s ease,
					border-color 0.16s ease,
					transform 0.16s ease,
					color 0.16s ease;
			}
			button:hover {
				background: rgba(255, 255, 255, 0.055);
				border-color: rgba(238, 232, 220, 0.32);
				transform: translateY(-1px);
			}
			button:focus-visible,
			input:focus-visible,
			summary:focus-visible,
			a:focus-visible,
			.card:focus-visible,
			.facet-token:focus-visible {
				outline: 2px solid rgba(199, 154, 82, 0.72);
				outline-offset: 2px;
			}
			a {
				color: inherit;
				text-decoration: none;
			}

			.app {
				height: 100vh;
				display: grid;
				grid-template-columns: var(--rail) 1fr;
			}

			.rail {
				background: rgba(9, 9, 8, 0.94);
				border-right: 1px solid var(--line);
				display: flex;
				flex-direction: column;
				gap: 12px;
				padding: 16px 8px;
			}
			.rail a {
				height: 46px;
				border-radius: 12px;
				display: grid;
				place-items: center;
				color: var(--text-soft);
				transition:
					background 0.16s ease,
					color 0.16s ease,
					transform 0.16s ease;
			}
			.rail a:hover {
				background: rgba(255, 255, 255, 0.045);
				color: var(--text);
				transform: translateX(1px);
			}
			.rail a.active {
				color: var(--accent-soft);
				background: rgba(199, 154, 82, 0.1);
				box-shadow: inset 3px 0 0 var(--accent);
			}
			.rail svg {
				width: 22px;
				height: 22px;
			}
			.rail-spacer {
				flex: 1;
			}

			.search-shell {
				min-width: 0;
				display: grid;
				grid-template-rows: auto 1fr;
				height: 100vh;
			}

			.top {
				border-bottom: 1px solid var(--line);
				background: rgba(12, 12, 11, 0.9);
				backdrop-filter: blur(12px);
				padding: 14px 20px 10px;
				z-index: 5;
			}
			.command-row {
				display: grid;
				grid-template-columns: minmax(340px, 1fr) auto auto auto;
				gap: 12px;
				align-items: center;
			}
			.search-box {
				position: relative;
			}
			.search-box input {
				width: 100%;
				min-height: 48px;
				border: 1px solid var(--line-strong);
				background: rgba(255, 255, 255, 0.025);
				border-radius: 10px;
				padding: 0 46px 0 48px;
				outline: 0;
				font-family: var(--serif);
				font-size: 24px;
				letter-spacing: 0.01em;
				color: var(--text);
				transition:
					border-color 0.16s ease,
					box-shadow 0.16s ease,
					background 0.16s ease;
			}
			.search-box input:focus {
				border-color: rgba(199, 154, 82, 0.58);
				box-shadow: 0 0 0 3px rgba(199, 154, 82, 0.12);
				background: rgba(255, 255, 255, 0.035);
			}
			.search-icon,
			.clear-search {
				position: absolute;
				top: 50%;
				transform: translateY(-50%);
			}
			.search-icon {
				left: 17px;
				color: var(--text-muted);
				font-size: 22px;
			}
			.clear-search {
				right: 10px;
				min-height: 28px;
				width: 28px;
				padding: 0;
				border-radius: 50%;
				color: var(--text-muted);
			}
			.state-switch {
				display: flex;
				gap: 6px;
				padding-left: 2px;
			}
			.state-btn {
				min-height: 34px;
				color: var(--text-soft);
				background: transparent;
			}
			.state-btn.active {
				color: var(--text);
				background: rgba(255, 255, 255, 0.035);
				border-color: rgba(199, 154, 82, 0.68);
				box-shadow: inset 0 0 0 1px rgba(199, 154, 82, 0.3);
			}

			.local-modes {
				display: flex;
				align-items: flex-end;
				gap: 32px;
				height: 42px;
				padding-left: 4px;
			}
			.local-mode {
				color: var(--text-muted);
				padding: 13px 0 10px;
				border-bottom: 1px solid transparent;
			}
			.local-mode.active {
				color: var(--text);
				border-bottom-color: var(--accent);
			}

			.content {
				min-height: 0;
				overflow: hidden;
				display: grid;
				grid-template-columns: var(--left) minmax(0, 1fr);
			}

			.facet-panel {
				border-right: 1px solid var(--line);
				background: rgba(13, 13, 12, 0.72);
				overflow: hidden;
			}
			.facet-scroll {
				height: 100%;
				overflow-y: auto;
				padding: 14px 14px 28px;
				scrollbar-color: rgba(238, 232, 220, 0.28) transparent;
			}

			.facet-section {
				border-bottom: 1px solid rgba(238, 232, 220, 0.075);
				padding: 10px 0;
			}
			.facet-section summary {
				min-height: 28px;
				list-style: none;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: space-between;
				color: var(--heading-muted);
				font-size: 11px;
				font-weight: 760;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				border-radius: 6px;
			}
			.facet-section summary::-webkit-details-marker {
				display: none;
			}
			.facet-section summary:hover {
				color: var(--text);
			}
			.chev {
				color: var(--text-muted);
				display: inline-block;
				transition: transform 0.18s ease;
			}
			details:not([open]) > summary .chev {
				transform: rotate(-90deg);
			}
			.facet-tokens {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				padding-top: 7px;
			}
			.facet-token {
				border: 1px solid rgba(238, 232, 220, 0.105);
				background: rgba(255, 255, 255, 0.026);
				border-radius: 7px;
				color: var(--text-soft);
				padding: 4px 8px;
				font-size: 12px;
				transition:
					background 0.14s ease,
					border-color 0.14s ease,
					transform 0.14s ease;
			}
			.facet-token:hover {
				background: rgba(255, 255, 255, 0.052);
				border-color: rgba(238, 232, 220, 0.22);
				transform: translateY(-1px);
			}
			.facet-token .count {
				color: var(--text-muted);
				margin-left: 4px;
			}
			.facet-token.visual {
				color: var(--visual);
			}
			.facet-token.entity {
				color: var(--entity);
			}
			.facet-token.artist {
				color: var(--artist);
			}
			.facet-token.work {
				color: var(--work);
			}
			.facet-token.theme {
				color: var(--theme);
			}
			.facet-token.source {
				color: var(--source);
			}
			.facet-token.classifier {
				color: var(--classifier);
				font-family: var(--mono);
				font-size: 11px;
			}

			.classifier-list {
				padding-top: 6px;
			}
			.classifier-list details {
				border: 1px solid rgba(238, 232, 220, 0.08);
				background: rgba(255, 255, 255, 0.018);
				border-radius: 8px;
				margin: 6px 0;
				overflow: hidden;
			}
			.classifier-list summary {
				min-height: 34px;
				padding: 0 9px;
				color: var(--classifier);
				font-family: var(--mono);
				font-size: 12px;
				letter-spacing: 0;
				text-transform: none;
			}
			.classifier-values {
				border-top: 1px solid rgba(238, 232, 220, 0.07);
				padding: 7px 8px 9px 18px;
				display: grid;
				gap: 5px;
			}
			.classifier-value {
				color: var(--text-soft);
				font-size: 12px;
				display: flex;
				justify-content: space-between;
				gap: 12px;
				border-radius: 5px;
				padding: 2px 4px;
			}
			.classifier-value:hover {
				background: rgba(255, 255, 255, 0.04);
			}
			.classifier-value strong {
				color: var(--classifier);
				font-weight: 520;
			}
			.classifier-value span {
				color: var(--text-muted);
			}

			.main-scroll {
				min-width: 0;
				overflow-y: auto;
				padding: 14px 18px 30px;
				scrollbar-color: rgba(238, 232, 220, 0.3) transparent;
			}

			.wiki-preview {
				border: 1px solid var(--line-strong);
				border-radius: 10px;
				background:
					radial-gradient(circle at 12% 20%, rgba(255, 255, 255, 0.035), transparent 32%),
					rgba(17, 16, 15, 0.82);
				margin-bottom: 18px;
				overflow: hidden;
			}
			.wiki-preview > summary {
				list-style: none;
				cursor: pointer;
				padding: 0;
			}
			.wiki-preview > summary::-webkit-details-marker {
				display: none;
			}
			.preview-summary {
				min-height: 38px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 14px;
				border-bottom: 1px solid rgba(238, 232, 220, 0.08);
			}
			.preview-summary .label {
				color: var(--heading-muted);
				font-size: 11px;
				font-weight: 760;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}
			.preview-summary .hint {
				color: var(--text-muted);
				font-size: 12px;
			}
			.wiki-preview:not([open]) .preview-summary {
				border-bottom: 0;
			}

			.preview-body {
				display: grid;
				grid-template-columns: minmax(270px, 1.3fr) 1fr 1fr 1fr;
				gap: 0;
				animation: reveal 0.18s ease both;
			}
			@keyframes reveal {
				from {
					opacity: 0.72;
					transform: translateY(-3px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
			.preview-block {
				padding: 16px 18px 17px;
				border-right: 1px solid var(--line);
				min-width: 0;
			}
			.preview-block:last-child {
				border-right: 0;
			}
			.concept-title {
				display: flex;
				align-items: baseline;
				gap: 9px;
				margin-bottom: 6px;
			}
			.concept-title h1 {
				margin: 0;
				font-family: var(--serif);
				font-size: 31px;
				font-weight: 500;
				letter-spacing: -0.02em;
			}
			.star {
				color: var(--accent-soft);
				font-size: 19px;
			}
			.concept-type {
				color: var(--text-muted);
				font-size: 12px;
				margin-bottom: 12px;
			}
			.reviewed {
				color: var(--positive);
			}
			.preview-copy {
				color: var(--text-soft);
				line-height: 1.55;
				font-size: 13px;
			}
			.preview-heading {
				color: var(--heading-muted);
				font-size: 11px;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				font-weight: 760;
				margin-bottom: 9px;
			}
			.mini-list {
				display: flex;
				flex-wrap: wrap;
				gap: 7px;
			}
			.mini-chip {
				border: 1px solid rgba(238, 232, 220, 0.11);
				border-radius: 7px;
				padding: 4px 7px;
				color: var(--text-soft);
				background: rgba(255, 255, 255, 0.023);
				font-size: 12px;
			}
			.mini-chip.visual {
				color: var(--visual);
			}
			.mini-chip.artist {
				color: var(--artist);
			}
			.mini-chip.classifier {
				color: var(--classifier);
				font-family: var(--mono);
				font-size: 11px;
			}
			.mini-chip.theme {
				color: var(--theme);
			}
			.mini-chip.work {
				color: var(--work);
			}
			.mini-artworks {
				display: grid;
				grid-template-columns: repeat(4, 42px);
				gap: 6px;
				margin-bottom: 10px;
			}
			.mini-thumb {
				height: 48px;
				border-radius: 6px;
				border: 1px solid rgba(238, 232, 220, 0.13);
				background: var(--art);
				background-size: cover;
				background-position: center;
			}
			.preview-link {
				display: inline-flex;
				color: var(--accent-soft);
				margin-top: 12px;
				gap: 8px;
				border-radius: 5px;
			}
			.preview-link:hover {
				color: var(--text);
			}

			.result-toolbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin: 8px 6px 12px;
			}
			.result-count {
				color: var(--text-soft);
				font-size: 15px;
			}
			.result-count .concept {
				color: var(--accent-soft);
			}
			.toolbar-actions {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.sort {
				color: var(--text-muted);
			}
			.sort strong {
				color: var(--text-soft);
				font-weight: 520;
			}
			.view-btn.active {
				background: rgba(255, 255, 255, 0.04);
				border-color: rgba(199, 154, 82, 0.56);
				box-shadow: inset 0 0 0 1px rgba(199, 154, 82, 0.24);
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(5, minmax(190px, 1fr));
				gap: 16px;
			}
			.card {
				border: 1px solid var(--line-strong);
				background: rgba(18, 17, 16, 0.84);
				border-radius: 9px;
				overflow: hidden;
				transition:
					transform 0.16s ease,
					border-color 0.16s ease,
					background 0.16s ease,
					box-shadow 0.16s ease;
				cursor: pointer;
				color: var(--text);
			}
			.card:hover,
			.card.selected {
				transform: translateY(-3px);
				border-color: rgba(238, 232, 220, 0.32);
				background: rgba(25, 24, 22, 0.92);
			}
			.card.selected {
				box-shadow: inset 0 0 0 1px rgba(199, 154, 82, 0.34);
				border-color: rgba(199, 154, 82, 0.46);
			}
			.thumb {
				height: 190px;
				background: var(--art);
				background-size: cover;
				background-position: center;
				border-bottom: 1px solid var(--line);
				filter: saturate(0.86) contrast(1.03);
				position: relative;
				overflow: hidden;
			}
			.thumb::after {
				content: '';
				position: absolute;
				inset: 0;
				background: linear-gradient(180deg, transparent 56%, rgba(0, 0, 0, 0.22));
			}
			.card-body {
				padding: 10px 11px 11px;
			}
			.card-title {
				font-family: var(--serif);
				font-size: 16px;
				color: var(--text);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				margin-bottom: 4px;
			}
			.card-meta {
				color: var(--text-muted);
				font-size: 12px;
				line-height: 1.35;
				min-height: 32px;
			}
			.card-status {
				display: flex;
				align-items: center;
				justify-content: space-between;
				border-top: 1px solid rgba(238, 232, 220, 0.07);
				padding-top: 9px;
				margin-top: 9px;
				color: var(--text-muted);
				font-size: 12px;
			}
			.status-tagged {
				color: var(--positive);
			}
			.status-review {
				color: var(--review);
			}
			.status-empty {
				color: var(--text-muted);
			}
			.tag-count {
				color: var(--text-muted);
			}
			.card-chips {
				display: flex;
				flex-wrap: wrap;
				gap: 5px;
				margin-top: 9px;
			}
			.card-chip {
				border: 1px solid rgba(238, 232, 220, 0.1);
				border-radius: 6px;
				padding: 3px 6px;
				font-size: 11px;
				background: rgba(255, 255, 255, 0.022);
				color: var(--text-soft);
			}
			.card-chip.visual {
				color: var(--visual);
			}
			.card-chip.artist {
				color: var(--artist);
			}
			.card-chip.classifier {
				color: var(--classifier);
				font-family: var(--mono);
			}
			.card-chip.review {
				color: var(--review);
			}
			.card-chip.theme {
				color: var(--theme);
			}
			.card-chip.source {
				color: var(--source);
			}
			.tag-icon {
				width: 17px;
				height: 17px;
				opacity: 0.9;
			}

			.filter-pop {
				position: fixed;
				top: 74px;
				right: 80px;
				width: 280px;
				border: 1px solid var(--line-strong);
				border-radius: 10px;
				background: rgba(18, 17, 16, 0.98);
				box-shadow: 0 18px 70px rgba(0, 0, 0, 0.48);
				padding: 12px;
				z-index: 20;
				display: none;
			}
			.filter-pop.show {
				display: block;
				animation: reveal 0.16s ease both;
			}
			.filter-pop h3 {
				margin: 0 0 10px;
				color: var(--heading-muted);
				font-size: 11px;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}
			.filter-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				min-height: 32px;
				color: var(--text-soft);
				border-top: 1px solid rgba(238, 232, 220, 0.07);
			}
			.filter-row:first-of-type {
				border-top: 0;
			}
			.filter-row span:last-child {
				color: var(--text-muted);
			}

			.toast {
				position: fixed;
				right: 22px;
				bottom: 22px;
				background: rgba(19, 18, 17, 0.97);
				border: 1px solid var(--line-strong);
				color: var(--text-soft);
				padding: 10px 12px;
				border-radius: 9px;
				box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
				opacity: 0;
				transform: translateY(8px);
				pointer-events: none;
				transition:
					opacity 0.18s ease,
					transform 0.18s ease;
				z-index: 30;
			}
			.toast.show {
				opacity: 1;
				transform: translateY(0);
			}

			/* Refinement: selected states use a quiet, thin all-around accent rather than heavy underline/outline */
			.state-btn.active {
				color: var(--text);
				background: rgba(255, 255, 255, 0.035);
				border-color: rgba(199, 154, 82, 0.68);
				box-shadow: inset 0 0 0 1px rgba(199, 154, 82, 0.3);
			}
			.view-btn.active {
				background: rgba(255, 255, 255, 0.04);
				border-color: rgba(199, 154, 82, 0.56);
				box-shadow: inset 0 0 0 1px rgba(199, 154, 82, 0.24);
			}
			.card.selected {
				box-shadow: inset 0 0 0 1px rgba(199, 154, 82, 0.34);

				let stateName = 'picasso';
				const searchInput = document.getElementById('searchInput');
				const previewBody = document.getElementById('previewBody');
				const previewHint = document.getElementById('previewHint');
				const facetScroll = document.getElementById('facetScroll');
				const grid = document.getElementById('grid');
				const resultCount = document.getElementById('resultCount');
				const picassoBtn = document.getElementById('picassoBtn');
				const horseBtn = document.getElementById('horseBtn');
				const filterBtn = document.getElementById('filterBtn');
				const filterPop = document.getElementById('filterPop');
				const toast = document.getElementById('toast');

				function showToast(message) {
					toast.textContent = message;
					toast.classList.add('show');
					clearTimeout(showToast.timer);
					showToast.timer = setTimeout(() => toast.classList.remove('show'), 1200);
				}

				function classFor(type) {
					if (!type) return '';
					if (type === 'review') return 'review';
					if (type === 'positive') return 'positive';
					return type;
				}

				function renderFacets(state) {
					facetScroll.innerHTML = state.facets
						.map((section, index) => {
							const [title, items] = section;
							if (items === 'classifiers') {
								return `<details class="facet-section" open>
          <summary>${title} <span class="chev">⌄</span></summary>
          <div class="classifier-list">
            ${state.classifiers
							.map(
								([name, values], i) => `
              <details ${i < 2 ? 'open' : ''}>
                <summary>${name} <span class="chev">⌄</span></summary>
                <div class="classifier-values">
                  ${values.map(([value, count]) => `<a class="classifier-value" href="#"><strong>${value}</strong><span>${count}</span></a>`).join('')}
                </div>
              </details>
            `
							)
							.join('')}
          </div>
        </details>`;
							}
							return `<details class="facet-section" open>
        <summary>${title} <span class="chev">⌄</span></summary>
        <div class="facet-tokens">
          ${items.map(([label, count, type]) => `<a class="facet-token ${classFor(type)}" tabindex="0" href="#">${label}${count ? `<span class="count">${count}</span>` : ''}</a>`).join('')}
        </div>
      </details>`;
						})
						.join('');
				}

				function renderCards(state) {
					grid.innerHTML = state.cards
						.map((card, i) => {
							const [title, meta, status, count, chips, chipTypes, bg] = card;
							const statusClass =
								status === 'Needs review'
									? 'status-review'
									: status === 'Untagged'
										? 'status-empty'
										: 'status-tagged';
							return `<article class="card" tabindex="0" data-title="${title}">
        <div class="thumb" style="--art:${bg}"></div>
        <div class="card-body">
          <div class="card-title">${title}</div>
          <div class="card-meta">${meta}</div>
          <div class="card-status">
            <span class="${statusClass}">${status === 'Tagged' ? '✓ Tagged' : status === 'Needs review' ? '⌁ Needs review' : 'Untagged'}</span>
            <span class="tag-count">${count}</span>
          </div>
          <div class="card-chips">
            ${chips.map((chip, idx) => `<span class="card-chip ${classFor(chipTypes[idx])}">${chip}</span>`).join('')}
          </div>
        </div>
      </article>`;
						})
						.join('');
					grid.querySelectorAll('.card').forEach((card) => {
						card.addEventListener('click', () => {
							grid.querySelectorAll('.card').forEach((c) => c.classList.remove('selected'));
							card.classList.add('selected');
							showToast(`Selected ${card.dataset.title}`);
						});
						card.addEventListener('keydown', (e) => {
							if (e.key === 'Enter' || e.key === ' ') {
								e.preventDefault();
								card.click();
							}
						});
					});
				}

				function renderState(next) {
					stateName = next;
					const state = states[next];
					searchInput.value = state.query;
					previewHint.textContent = state.hint;
					previewBody.innerHTML = state.preview;
					if (state.count.includes('for')) {
						resultCount.innerHTML = `${state.count} <span class="concept">${state.conceptLabel}</span>`;
					} else {
						resultCount.textContent = state.count;
					}
					renderFacets(state);
					renderCards(state);
					picassoBtn.classList.toggle('active', next === 'picasso');
					horseBtn.classList.toggle('active', next === 'horse');
				}

				picassoBtn.addEventListener('click', () => renderState('picasso'));
				horseBtn.addEventListener('click', () => renderState('horse'));

				document.getElementById('clearSearch').addEventListener('click', () => {
					searchInput.value = '';
					searchInput.focus();
				});

				filterBtn.addEventListener('click', () => {
					filterPop.classList.toggle('show');
				});
				document.addEventListener('click', (e) => {
					if (!filterPop.contains(e.target) && e.target !== filterBtn)
						filterPop.classList.remove('show');
				});

				document.addEventListener('click', (e) => {
					const classifier = e.target.closest('.classifier-value');
					if (classifier) {
						e.preventDefault();
						showToast(
							`Applied classifier filter: ${classifier.textContent.trim().replace(/\s+/g, ' ')}`
						);
					}
					const facet = e.target.closest('.facet-token');
					if (facet) {
						e.preventDefault();
						showToast(`Applied facet: ${facet.textContent.trim()}`);
					}
					const link = e.target.closest('.preview-link');
					if (link) {
						e.preventDefault();
						showToast('Would open full wiki entry');
					}
				});

				renderState('picasso');
			})();
		</script>
